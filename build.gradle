plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ryanhcode.dev/releases" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }

    maven {
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }

    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument "--mixin.config=repophys.mixins.json"
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }


    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }



    sourceSets.main.resources { srcDir 'src/generated/resources' }


    dependencies {

        // LOCAL JARS
        implementation files("libs/veil-neoforge-1.21.1-4.1.3.jar")

        // SABLE FAMILY
        implementation "dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.3"
        implementation "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0"
        implementation("com.tterrag.registrate:Registrate:${registrate_version}")

        // PEHKUI
        implementation "curse.maven:pehkui-319596:5446174"

    }
}

// MOD METADATA GENERATION
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def props = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties props
    expand props
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
